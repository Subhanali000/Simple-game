<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="fullscreenBackground"></div>
    <div id="orientationMessage">
        Please rotate your device to landscape mode to play the game.
    </div>
    <div id="gameArea">
        <div id="pointDisplay" class="point-Display"></div>
        <div id="Balloon">
            <div id="bg_img" style="background-image: url('/images/bg screen image.png');"></div> <!-- Set background image dynamically -->
            <div id="scoreDisplay" class="score-Display">
                Score: 0
            </div>
            
            <!-- Interactive Elements -->
            <div id="pump_handle"></div>
            <div id="air_nuzzle"></div>
            <div id="air_pump_machine"></div>
            <div id="cloud"></div>
            <div id="cloud1"></div>
            <div id="cloud2"></div>
            <div id="birds"></div>
            <div id="birds1"></div>
                        <div id="name"><i>Subhan Ali</i></div>
            
            <button id="pauseButton">Pause</button>
            
            <!-- Audio for Pop Sound -->
            <audio id="popSound" src="/images/pop sund.mp3" preload="auto"></audio>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
